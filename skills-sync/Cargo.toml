[package]
name = "skills-sync"
version = "0.1.0"
edition = "2021"
description = "Sync Agent Skills from the skill-library into Claude Code, Codex, Cursor, and Pi"
license = "MIT"
default-run = "skills-sync"

[[bin]]
name = "skills-sync"
path = "src/main.rs"

[[bin]]
name = "skills-release"
path = "src/bin/skills-release.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
crossterm = "0.29.0"
dirs = "7.0.0"
fs_extra = "1.3.0"
ratatui = "0.30.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2.0.20"
toml = "1.1.6"
walkdir = "2.5.0"

[dev-dependencies]
assert_fs = "1.1.4"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.test]
# keep debug for coverage tooling
debug = true
